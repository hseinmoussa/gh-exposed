name: Bug report
description: Something gh-exposed got wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Do NOT paste secret values. Run IDs, workflow names and the gh-exposed command are enough.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `gh exposed version`
    validations:
      required: true

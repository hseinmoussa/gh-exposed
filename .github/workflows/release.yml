name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload binaries
      id-token: write      # sign build-provenance attestations
      attestations: write  # store them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds gh-exposed for every platform `gh extension install` supports
      # and attaches signed provenance, so users can run
      # `gh attestation verify` on what they downloaded.
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          generate_attestations: true
